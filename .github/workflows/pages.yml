name: Deploy invitation to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build enhanced invitation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Arabic premium typography
          s = s.replace(
              '<title>أنس × رنيم | 18.09.2026</title>',
              '<title>أنس × رنيم | 18.09.2026</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">'
          )
          s = s.replace(
              'body{font-family:Tahoma,Arial,"Segoe UI",sans-serif;',
              'body{font-family:"Tajawal",Tahoma,Arial,"Segoe UI",sans-serif;'
          )
          s = s.replace(
              '.copy.hero{top:22%;font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,9vw,46px);line-height:1.7}',
              '.copy.hero{top:21%;font-family:"Aref Ruqaa Ink",Georgia,"Times New Roman",serif;font-size:clamp(36px,10vw,54px);line-height:1.8;text-shadow:0 4px 24px rgba(0,0,0,.25)}'
          )
          s = s.replace(
              '.copy.names h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(58px,17vw,92px);line-height:1.08}',
              '.copy.names h1{margin:0;font-family:"Aref Ruqaa Ink",Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(64px,18vw,96px);line-height:1.08;text-shadow:0 6px 26px rgba(0,0,0,.26)}'
          )
          s = s.replace(
              '.copy.title h2{margin:5px 0 3px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(55px,16vw,82px);font-weight:400}',
              '.copy.title h2{margin:5px 0 3px;font-family:"Aref Ruqaa Ink",Georgia,"Times New Roman",serif;font-size:clamp(55px,16vw,82px);font-weight:700}'
          )
          s = s.replace(
              '.copy.contract h2{margin:6px 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,14vw,68px);font-weight:400}',
              '.copy.contract h2{margin:6px 0 4px;font-family:"Aref Ruqaa Ink",Georgia,"Times New Roman",serif;font-size:clamp(48px,14vw,68px);font-weight:700}'
          )
          s = s.replace(
              '.copy.final h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(54px,17vw,88px);font-weight:400;margin:10px 0 6px}',
              '.copy.final h2{font-family:"Aref Ruqaa Ink",Georgia,"Times New Roman",serif;font-size:clamp(54px,17vw,88px);font-weight:700;margin:10px 0 6px}'
          )
          s = s.replace('خيطان مختلفان… يلتقيان في عقدة واحدة.','خيطان مختلفان… يلتقيان في قلبٍ واحد.')

          # Make the visible circle a real press-and-hold button
          s = s.replace(
              '.hold-ui{position:absolute;z-index:95;left:50%;bottom:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;transition:.3s ease}',
              '.hold-ui{position:absolute;z-index:99;left:50%;bottom:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;touch-action:none;cursor:pointer;border:0;padding:0;background:transparent;color:inherit;-webkit-appearance:none;appearance:none;-webkit-touch-callout:none;transition:.3s ease}'
          )
          s = s.replace(
              '.holding .hold-label{color:rgba(241,217,167,.86)}',
              '.holding .hold-label{color:rgba(241,217,167,.86)}.hold-ui:disabled,.completed .hold-ui{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}.completed .audio{opacity:0;pointer-events:none}'
          )
          s = s.replace(
              '<div class="hold-ui"><div class="hold-ring"></div><div class="hold-label" id="holdLabel">اضغط باستمرار لتمسك الخيط</div></div>',
              '<button class="hold-ui" id="holdButton" type="button" aria-label="اضغط باستمرار لمتابعة الدعوة"><span class="hold-ring"></span><span class="hold-label" id="holdLabel">اضغط باستمرار لتمسك الخيط</span></button>'
          )
          s = s.replace(
              "const bar=document.getElementById('bar'),label=document.getElementById('holdLabel'),tap=document.getElementById('tapzone'),audioBtn=document.getElementById('audio');",
              "const bar=document.getElementById('bar'),label=document.getElementById('holdLabel'),tap=document.getElementById('tapzone'),holdBtn=document.getElementById('holdButton'),audioBtn=document.getElementById('audio');"
          )

          # Heart made from the two threads
          old_knot = "function knot(p){const cx=W*.5,cy=H*.48,a=[],b=[];for(let i=0;i<=60;i++){const q=i/60,ang=q*Math.PI*2;a.push([lerp(W*.14,cx,q)+Math.sin(ang*1.4)*45*(1-q),lerp(H*.72,cy,q)-Math.sin(q*Math.PI)*H*.3]);b.push([lerp(W*.86,cx,q)-Math.sin(ang*1.2)*40*(1-q),lerp(H*.26,cy,q)+Math.sin(q*Math.PI)*H*.25])}const n=Math.max(2,Math.floor(a.length*p));line(a.slice(0,n),'#aa6237',2.5,.95);line(b.slice(0,n),'#efd7a5',1.8,.95);glow(cx,cy,70,.18*p,'#d7b777')}"
          new_heart = "function heart(p){const cx=W*.5,cy=H*.47,scale=Math.min(W,H)*.0135,left=[],right=[],hp=[];for(let i=0;i<=42;i++){const q=i/42;left.push([lerp(W*.16,cx-18,q),lerp(H*.72,cy+42,q)-Math.sin(q*Math.PI)*42]);right.push([lerp(W*.84,cx+18,q),lerp(H*.28,cy+42,q)+Math.sin(q*Math.PI)*34])}const inc=smooth(0,.45,p),nl=Math.max(2,Math.floor(left.length*inc));line(left.slice(0,nl),'#aa6237',2.7,.96);line(right.slice(0,nl),'#efd7a5',2.2,.96);for(let i=0;i<=220;i++){const a=i/220*Math.PI*2,x=16*Math.pow(Math.sin(a),3),y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);hp.push([cx+x*scale,cy-y*scale])}const q=smooth(.28,1,p),n=Math.max(2,Math.floor(hp.length*q));glow(cx,cy,92,.15*q,'#d7b777');line(hp.slice(0,n),'#f1d9a7',2.3,.96);line(hp.slice(0,n).map(v=>[v[0]+2,v[1]+1]),'#aa6237',1.1,.55)}"
          s = s.replace(old_knot,new_heart)

          # Final thread fireworks
          old_roots = "function roots(p){const cx=W*.5,base=H*.85;ctx.strokeStyle='#a96237';ctx.lineWidth=2;ctx.lineCap='round';const branches=[[[cx,base],[W*.44,H*.72],[W*.31,H*.66],[W*.22,H*.56]],[[cx,base],[W*.56,H*.72],[W*.69,H*.65],[W*.8,H*.54]],[[cx,base],[cx,H*.67],[W*.49,H*.56],[W*.51,H*.45],[W*.5,H*.33]]];branches.forEach((pts,idx)=>{const q=clamp(p*1.25-idx*.08),out=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];for(let s=0;s<14;s++){const u=s/14;out.push([lerp(a[0],b[0],u),lerp(a[1],b[1],u)])}}out.push(pts.at(-1));const n=Math.max(2,Math.floor(out.length*q));line(out.slice(0,n),idx===2?'#efd7a5':'#a96237',idx===2?1.8:2.2,.9)});glow(cx,H*.42,100,.15*p,'#d7b777')}"
          new_fireworks = "function burst(cx,cy,p,delay,a='#efd7a5',b='#aa6237'){const q=clamp((p-delay)/(1-delay));if(q<=0)return;const trail=smooth(0,.3,q),boom=smooth(.18,1,q),pts=[];for(let i=0;i<=26;i++){const u=i/26;pts.push([lerp(W*.5,cx,u)+Math.sin(u*Math.PI+t*.001+i)*5*(1-u),lerp(H*.84,cy,u)-Math.sin(u*Math.PI)*26])}line(pts.slice(0,Math.max(2,Math.floor(pts.length*trail))),b,2,.84);if(trail>.7)glow(cx,cy,38,.18*boom,a);for(let i=0;i<18;i++){const ang=Math.PI*2*i/18+delay*2.8,len=(28+(i%3)*11)*(.3+.7*boom),ex=cx+Math.cos(ang)*len,ey=cy+Math.sin(ang)*len;line([[cx,cy],[ex,ey]],i%2?a:b,i%2?1.8:1.3,.88*boom);ctx.globalAlpha=.7*boom;ctx.fillStyle=i%2?a:b;ctx.beginPath();ctx.arc(ex,ey,1.6+(i%2)*.7,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}function fireworks(p){burst(W*.28,H*.34,p,0);burst(W*.72,H*.27,p,.18,'#ffe7bc','#c78352');burst(W*.52,H*.18,p,.34);if(p>.5){for(let i=0;i<28;i++){const q=clamp((p-.5)/.5),x=W*(.18+((i*37)%64)/100),y=H*(.14+((i*29)%52)/100);ctx.globalAlpha=.14*q;ctx.fillStyle=i%2?'#efd7a5':'#aa6237';ctx.beginPath();ctx.arc(x,y+Math.sin(t*.002+i)*3,1.4+(i%3)*.35,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}}"
          s = s.replace(old_roots,new_fireworks)

          s = s.replace('if(k>0)knot(k);','if(k>0)heart(k);')
          s = s.replace('if(r>0)roots(r);','if(r>0)fireworks(r);')

          # Completion behavior and robust hold support
          s = s.replace(
              "if(t>=TOTAL){holding=false;shell.classList.remove('holding');label.textContent='اكتملت الحكاية — اضغط باستمرار لإعادتها';setAudio(false);return}",
              "if(t>=TOTAL){holding=false;shell.classList.remove('holding');shell.classList.add('completed');label.textContent='اكتملت الحكاية';holdBtn.disabled=true;tap.style.pointerEvents='none';setAudio(false);render();return}"
          )
          s = s.replace(
              "function down(e){e.preventDefault();if(t>=TOTAL)t=0;startAudio();holding=true;last=0;shell.classList.add('holding');shell.classList.remove('paused-progress');label.textContent='أنت تمسك خيط الحكاية…';setAudio(true);if(navigator.vibrate)navigator.vibrate(12);raf=requestAnimationFrame(loop)}",
              "function down(e){e.preventDefault();if(t>=TOTAL)return;if(e.currentTarget&&e.currentTarget.setPointerCapture&&e.pointerId!==undefined){try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}startAudio();holding=true;last=0;shell.classList.add('holding');shell.classList.remove('paused-progress');label.textContent='أنت تمسك خيط الحكاية…';setAudio(true);if(navigator.vibrate)navigator.vibrate(12);raf=requestAnimationFrame(loop)}"
          )
          s = s.replace(
              "tap.addEventListener('pointerdown',down);tap.addEventListener('pointerup',up);tap.addEventListener('pointercancel',up);tap.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')up()});",
              "function bindHold(el){el.addEventListener('pointerdown',down,{passive:false});el.addEventListener('pointerup',up,{passive:false});el.addEventListener('pointercancel',up,{passive:false});el.addEventListener('lostpointercapture',up)}bindHold(tap);bindHold(holdBtn);tap.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')up()});holdBtn.addEventListener('contextmenu',e=>e.preventDefault());"
          )

          p.write_text(s,encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
